apiVersion: batch/v1
kind: Job
metadata:
  name: django-migrate
  namespace: conduit-app
spec:
  template:
    spec:
      containers:
      - name: migrate
        image: django-app:latest
        imagePullPolicy: Never
        command: ["python", "manage.py", "migrate", "--noinput"]
        env:
        - name: DB_HOST
          value: mysql-service
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_DATABASE
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD
      restartPolicy: Never
  backoffLimit: 4
